<section class="section">
    <div class="container contact-grid">
        <div class="contact-info-wrap">
            <div>
                <span class="section-tag">📞 კონტაქტი</span>
                <h2 class="section-title">დაგვიკავშირდით</h2>
                <p style="color: var(--text-light)">გაქვთ კითხვები? ჩვენ მზად ვართ დაგეხმაროთ.</p>
            </div>
            <div class="contact-method">
                <div class="contact-icon">📞</div>
                <div class="contact-text">
                    <h3>ტელეფონი</h3>
                    <p>+995 599 123 456</p>
                </div>
            </div>
            <div class="contact-method">
                <div class="contact-icon">✉️</div>
                <div class="contact-text">
                    <h3>ელფოსტა</h3>
                    <p>contact@gmail.com</p>
                </div>
            </div>
            <div class="contact-socials">
                <a class="social-link" href="#">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a class="social-link" href="#">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>
        </div>
        <div class="card-form">
            <form>
                <div class="form-group">
                    <label class="form-label">სახელი და გვარი</label>
                    <input type="text" class="form-input" />
                    <span class="field-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">ელფოსტა</label>
                    <input type="email" class="form-input" />
                    <span class="field-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">შეტყობინება</label>
                    <textarea id="contactMsg" class="form-input" rows="4"></textarea>
                    <span class="field-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">გაგზავნა</span>
                </button>
            </form>
        </div>
    </div>
</section>
